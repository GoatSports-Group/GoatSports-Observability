global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: goatsports
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:7090]
        labels: {service: api-gateway}
      - targets: [host.docker.internal:7071]
        labels: {service: auth-service}
      - targets: [host.docker.internal:7072]
        labels: {service: venue-service}
      - targets: [host.docker.internal:7073]
        labels: {service: notification-service}
      - targets: [host.docker.internal:7074]
        labels: {service: report-service}
      - targets: [host.docker.internal:7075]
        labels: {service: storage-service}
      - targets: [host.docker.internal:7076]
        labels: {service: workflow-service}
      - targets: [host.docker.internal:7077]
        labels: {service: audit-service}
      - targets: [host.docker.internal:7078]
        labels: {service: payment-service}
      - targets: [host.docker.internal:7079]
        labels: {service: club-service}
      - targets: [host.docker.internal:7080]
        labels: {service: social-service}
      - targets: [host.docker.internal:7081]
        labels: {service: ai-service}

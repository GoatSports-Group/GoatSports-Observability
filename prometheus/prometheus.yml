global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Moi target la ten service trong infrastructure/compose (cung goatsports-network) + cong SERVER_PORT.
# Label `service` dung cho dashboard va alert; ai-service (FastAPI) xuat cung ten metric Micrometer o /actuator/prometheus.
# eureka-server chua co metrics, chi theo doi qua log.
scrape_configs:
  - job_name: goatsports
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway-server:7090]
        labels: {service: api-gateway}
      - targets: [auth-service:7071]
        labels: {service: auth-service}
      - targets: [venue-service:7072]
        labels: {service: venue-service}
      - targets: [notification-service:7073]
        labels: {service: notification-service}
      - targets: [report-service:7074]
        labels: {service: report-service}
      - targets: [storage-service:7075]
        labels: {service: storage-service}
      - targets: [workflow-service:7076]
        labels: {service: workflow-service}
      - targets: [audit-service:7077]
        labels: {service: audit-service}
      - targets: [payment-service:7078]
        labels: {service: payment-service}
      - targets: [club-service:7079]
        labels: {service: club-service}
      - targets: [social-service:7080]
        labels: {service: social-service}
      - targets: [ai-service:7081]
        labels: {service: ai-service}
